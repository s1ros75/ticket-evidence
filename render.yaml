# Render の Blueprint（公開するデモ用）
# https://render.com/docs/blueprint-spec
#
# - Web サービス：Dockerfile.production のイメージ（画面とAPIを1つのサービスで配信）
# - PostgreSQL
# - Cron Job：毎日デモのデータを作り直す（bin/rails demo:reset）
#
# plan（料金プラン）は、Render の料金ページで最新の内容を確認してから決めること。
# 無料のプランは、使われていないとサービスが止まる・データベースに期限があるなどの制限がある。

envVarGroups:
  - name: ticket-evidence-demo
    envVars:
      # パスワード変更と仮パスワードの発行を止め、demo:reset を使えるようにする
      - key: DEMO_MODE
        value: "1"
      # 起動のたびに、デモのアカウント（とチケットが0件ならデモのチケット）を用意する
      - key: SEED_DEMO
        value: "1"
      # 画面の上に、デモ環境であることを表示する（画面のビルド時に使う）
      - key: VITE_DEMO_MODE
        value: "1"
      - key: SECRET_KEY_BASE
        generateValue: true

databases:
  - name: ticket-evidence-db
    databaseName: ticket_evidence
    plan: free

services:
  - type: web
    name: ticket-evidence
    runtime: docker
    dockerfilePath: ./Dockerfile.production
    dockerContext: .
    plan: free
    healthCheckPath: /up
    envVars:
      - fromGroup: ticket-evidence-demo
      - key: DATABASE_URL
        fromDatabase:
          name: ticket-evidence-db
          property: connectionString

  - type: cron
    name: ticket-evidence-demo-reset
    runtime: docker
    dockerfilePath: ./Dockerfile.production
    dockerContext: .
    plan: starter
    # 毎日 3:00（日本時間）。Render の cron の時刻は UTC
    schedule: "0 18 * * *"
    dockerCommand: bin/rails demo:reset
    envVars:
      - fromGroup: ticket-evidence-demo
      - key: DATABASE_URL
        fromDatabase:
          name: ticket-evidence-db
          property: connectionString
