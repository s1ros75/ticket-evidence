# Render の Blueprint（公開するデモ用）
# https://render.com/docs/blueprint-spec
#
# - Web サービス：Dockerfile.production のイメージ（画面とAPIを1つのサービスで配信）
# - PostgreSQL
#
# どちらも無料のプランにしている（カードの登録なしで作れる構成）。
# 無料のプランには、使われていないとサービスが止まる・データベースに期限があるなどの制限があるので、
# Render の料金ページで最新の内容を確認すること。
#
# デモのデータは、起動のたびに作り直す（backend/bin/start）。
# 無料のサービスは使われないと止まり、次に開かれたときに起動し直すので、そのたびにリセットされる。

databases:
  - name: ticket-evidence-db
    databaseName: ticket_evidence
    plan: free

services:
  - type: web
    name: ticket-evidence
    runtime: docker
    dockerfilePath: ./Dockerfile.production
    dockerContext: .
    plan: free
    healthCheckPath: /up
    envVars:
      # パスワード変更と仮パスワードの発行を止め、起動のたびにデモのデータを作り直す
      - key: DEMO_MODE
        value: "1"
      # 画面の上に、デモ環境であることを表示する（画面のビルド時に使う）
      - key: VITE_DEMO_MODE
        value: "1"
      - key: SECRET_KEY_BASE
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: ticket-evidence-db
          property: connectionString
